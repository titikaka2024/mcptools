name: Feature request
description: Suggest a useful improvement for mcptools
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What MCP authoring or maintenance problem would this solve?
      placeholder: "When building MCP servers, I need..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the command, template, validation, or wrapper behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - create
        - test
        - inspect
        - wrap rest
        - wrap cli
        - validator
        - documentation
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or related tools.
